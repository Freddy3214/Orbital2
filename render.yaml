services:
  - type: web
    runtime: node
    name: orbital-foundry
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: orbital-foundry-db
          property: connectionString

databases:
  - name: orbital-foundry-db
    plan: free
