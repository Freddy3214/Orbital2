name: Keep game awake
on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/keep-warm.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Request game health endpoint
        run: curl --fail --silent --show-error --max-time 90 --retry 1 --retry-delay 5 https://orbital-foundry-game.onrender.com/health
